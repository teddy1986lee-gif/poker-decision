  // ---------- 문제 상세 · 검수 ----------
  function detail() {
    const p = App.byId(ui.sel);
    if (!p) { ui.sel = null; return bankList(); }
    const errs = App.valid(p);
    let st = null, svg = '';
    if (!errs.length) { st = PD.build(p); svg = TableView.render(st, { units: 'bb', label: p.ti }); }
    const ans = App.ansOf(p);
    const optRows = p.o.map((tok, i) => `<div class="field"><label class="ansbox"><span style="display:flex;gap:8px;align-items:center"><input type="checkbox" data-ans="${i}" ${ans.includes(i) ? 'checked' : ''} ${p.ex ? 'disabled' : ''}> <b>${U.esc(st ? App.optLabel(st, tok) : tok)}</b> <code class="tok">${U.esc(tok)}</code> 정답</span></label>
        <textarea data-note="${i}" aria-label="선택지 ${i + 1} 설명" placeholder="이 선택의 문제점 또는 보충 설명">${U.esc((p.n || [])[i] || '')}</textarea></div>`).join('');
    return `<div class="spread"><div class="row"><button class="btn btn-line" type="button" id="d-back">← 목록</button><span class="id" style="font:800 20px/1 var(--f-display)">${U.esc(p.id)}</span>${App.lvPill(p.lv)}${App.rvPill(p.rv)}</div>
        <div class="row">${!errs.length ? '<button class="btn btn-line" type="button" id="d-try">미리 풀기</button>' : ''}${p.custom ? '<button class="btn btn-line" type="button" id="d-edit">전체 수정</button><button class="btn btn-line" type="button" id="d-del">삭제</button>' : ''}</div></div>
      ${errs.length ? `<ul class="errs">${errs.map(e => `<li>${U.esc(e)}</li>`).join('')}</ul>` : ''}
      <div class="playgrid"><div style="display:grid;gap:10px;min-width:0"><h3 style="font-size:18px">${U.esc(p.ti)}</h3>
          <div class="tablewrap">${svg}</div>
          <div class="panel pad small" style="display:grid;gap:4px"><div><span class="muted">카드</span> <code class="tok">${U.esc(p.c)}</code> · <span class="muted">보드</span> <code class="tok">${U.esc(p.b || '없음')}</code></div><div><span class="muted">액션</span> <code class="tok">${U.esc(p.a || '(첫 행동)')}</code></div><div><span class="muted">블라인드</span> ${p.bl.join(' / ')} · <span class="muted">스택</span> ${U.esc(JSON.stringify(p.s))}</div></div></div>
        <div class="editor" style="min-width:0">
          <div class="field"><label for="d-rv">검수 상태</label><select id="d-rv">${Object.entries(RV).map(([k, [t]]) => `<option value="${k}" ${p.rv === k ? 'selected' : ''}>${t}</option>`).join('')}</select></div>
          ${p.ex ? '<p class="small muted" style="margin:0">기획서 예시 문제는 정답을 지정하지 않고 화면 구성 예시로만 씁니다.</p>' : ''}
          <div class="field"><label for="d-ctx">상황 설명(상대 성향·상금 구조)</label><textarea id="d-ctx" placeholder="필요할 때만 입력">${U.esc(p.ctx || '')}</textarea></div>
          <div class="field"><label for="d-w">권장 행동의 이유</label><textarea id="d-w" style="min-height:120px">${U.esc(p.w || '')}</textarea></div>
          <div class="eyebrow">선택지 · 정답 · 설명</div>${optRows}
          ${ui.msg}
          <button class="btn btn-ink" type="button" id="d-save">${shared() ? '저장하고 모두에게 적용' : '저장'}</button>
          <div id="d-confirm"></div>
        </div></div>`;
  }
  function bindDetail(el) {
    const p = App.byId(ui.sel); if (!p) return;
    U.$('#d-back', el).onclick = () => { ui.sel = null; ui.msg = ''; rerenderBody(); };
    const tr = U.$('#d-try', el); if (tr) tr.onclick = () => App.startPreview(p.id);
    U.$('#d-save', el).onclick = () => {
      const ans = U.$$('[data-ans]', el).filter(x => x.checked).map(x => +x.dataset.ans);
      if (!p.ex && !ans.length) { ui.msg = `<ul class="errs"><li>정답을 하나 이상 고르세요.</li></ul>`; return rerenderBody(); }
      const notes = U.$$('[data-note]', el).map(x => x.value.trim());
      const w = U.$('#d-w', el).value.trim(), ctx = U.$('#d-ctx', el).value.trim();
      const rv = U.$('#d-rv', el).value;
      const edits = { ...S.edits };
      edits[p.id] = { ...(edits[p.id] || {}), ans: p.ex ? null : (ans.length === 1 ? ans[0] : ans), w, n: notes, ctx: ctx || undefined };
      if (!edits[p.id].ctx) delete edits[p.id].ctx;
      Store.setAdmin('edits', edits);
      Store.setAdmin('review', { ...S.review, [p.id]: rv });
      ui.msg = `<div class="okmsg">${p.id} 저장됨 · ${RV[rv][0]}</div>`; rerenderBody();
    };
    const ed = U.$('#d-edit', el); if (ed) ed.onclick = () => { ui.ed = { ...S.custom[p.id] }; ui.tab = 'new'; ui.sel = null; App.render(); };
    const dl = U.$('#d-del', el); if (dl) dl.onclick = () => {
      U.$('#d-confirm', el).innerHTML = `<div class="panel pad row"><span class="small">${p.id}를 삭제할까요? 되돌릴 수 없습니다.</span><button class="btn btn-line" type="button" id="d-no">취소</button><button class="btn btn-ink" type="button" id="d-yes">삭제</button></div>`;
      U.$('#d-no', el).onclick = () => { U.$('#d-confirm', el).innerHTML = ''; };
      U.$('#d-yes', el).onclick = () => { Store.deleteCustom(p.id); ui.sel = null; rerenderBody(); U.toast(`${p.id} 삭제됨`); };
    };
  }

  // ---------- 문제 등록(에디터) ----------
  const blank = () => ({ id: '', lv: 1, tp: TOPICS[0], ti: '', pl: 9, bl: [500, 1000, 1000], s: 40, h: 'BTN', c: 'AsKd', b: '', a: 'f f f f f f', o: ['f', 'c', 'r2.2', 'a'], ans: 2, w: '', n: [], ctx: '' });
  function parseStack(def, txt) {
    const o = { d: +def || 40 };
    (txt || '').split(/[,\s]+/).filter(Boolean).forEach(kv => { const [k, v] = kv.split(':'); if (k && v && !isNaN(+v)) o[k.trim().toUpperCase().replace('UTG+1', 'U1')] = +v; });
    return Object.keys(o).length === 1 ? o.d : o;
  }
  const stackTxt = s => typeof s === 'number' ? '' : Object.entries(s).filter(([k]) => k !== 'd').map(([k, v]) => `${PD.posName(k)}:${v}`).join(', ');
  function nextId() { let n = 1; while (S.custom['N' + String(n).padStart(3, '0')]) n++; return 'N' + String(n).padStart(3, '0'); }
  function edProblem() {
    const e = ui.ed;
    const p = { id: e.id || nextId(), lv: +e.lv, tp: e.tp, ti: e.ti || '제목 없음', bl: e.bl.map(Number), s: e.s, h: e.h, c: e.c, b: e.b, a: e.a, o: e.o, ans: e.ans, w: e.w, n: e.n };
    if (+e.pl !== 8) p.pl = +e.pl;
    if (e.ctx) p.ctx = e.ctx;
    return p;
  }
  function editor() {
    if (!ui.ed) ui.ed = blank();
    const e = ui.ed;
    const posOpts = PD.POS[e.pl].map(k => `<option value="${k}" ${e.h === k ? 'selected' : ''}>${PD.posName(k)}</option>`).join('');
    return `<div class="playgrid"><form class="editor" id="ed" style="min-width:0">
        <div class="grid2">
          <div class="field"><label for="ed-lv">난이도</label><select id="ed-lv">${[1, 2, 3].map(l => `<option value="${l}" ${+e.lv === l ? 'selected' : ''}>${LV[l].nm}</option>`).join('')}</select></div>
          <div class="field"><label for="ed-tp">학습 주제</label><select id="ed-tp">${TOPICS.map(t => `<option ${e.tp === t ? 'selected' : ''}>${t}</option>`).join('')}</select></div>
        </div>
        <div class="field"><label for="ed-ti">제목</label><input id="ed-ti" value="${U.esc(e.ti)}" placeholder="예: CO에서 KTo"></div>
        <div class="grid2">
          <div class="field"><label for="ed-pl">인원</label><select id="ed-pl">${[9, 8, 7, 6, 5, 4, 3].map(n => `<option ${+e.pl === n ? 'selected' : ''}>${n}</option>`).join('')}</select></div>
          <div class="field"><label for="ed-sb">SB</label><input id="ed-sb" type="number" inputmode="numeric" value="${e.bl[0]}"></div>
          <div class="field"><label for="ed-bb">BB</label><input id="ed-bb" type="number" inputmode="numeric" value="${e.bl[1]}"></div>
          <div class="field"><label for="ed-an">BB 앤티</label><input id="ed-an" type="number" inputmode="numeric" value="${e.bl[2]}"></div>
        </div>
        <div class="grid2">
          <div class="field"><label for="ed-sd">기본 스택(BB)</label><input id="ed-sd" type="number" inputmode="decimal" value="${typeof e.s === 'number' ? e.s : (e.s.d || 40)}"></div>
          <div class="field"><label for="ed-sx">스택 예외</label><input id="ed-sx" value="${U.esc(stackTxt(e.s))}" placeholder="BTN:22, BB:15"></div>
        </div>
        <div class="grid2">
          <div class="field"><label for="ed-h">내 포지션</label><select id="ed-h">${posOpts}</select></div>
          <div class="field"><label for="ed-c">내 카드</label><input id="ed-c" value="${U.esc(e.c)}" placeholder="AsKd"></div>
          <div class="field"><label for="ed-b">보드</label><input id="ed-b" value="${U.esc(e.b)}" placeholder="Kh7c2s"></div>
        </div>
        <div class="field"><label for="ed-a">액션 순서</label><input id="ed-a" value="${U.esc(e.a)}" placeholder="f f f f r2.2 c f f | b2 c | b2.7">
          <span class="hint">프리플랍 UTG부터 차례대로. <code class="tok">f</code> 폴드 <code class="tok">x</code> 체크 <code class="tok">c</code> 콜 <code class="tok">b2.5</code> 베팅(BB) <code class="tok">r7</code> 레이즈 총액(BB) <code class="tok">a</code> 올인 · 스트리트는 <code class="tok">|</code>로 구분 · 마지막은 내 차례 직전까지</span></div>
        <div class="field"><label for="ed-o">선택지</label><input id="ed-o" value="${U.esc(e.o.join(' '))}" placeholder="f c r7 a"><span class="hint">같은 표기로 2~5개. 상대 베팅이 없으면 체크·베팅, 있으면 폴드·콜·레이즈.</span></div>
        <div id="ed-opts" style="display:grid;gap:10px"></div>
        <div class="field"><label for="ed-w">권장 행동의 이유</label><textarea id="ed-w">${U.esc(e.w)}</textarea></div>
        <div class="field"><label for="ed-ctx">상황 설명(선택)</label><textarea id="ed-ctx" placeholder="상대 성향이나 상금 구조가 판단에 필요할 때">${U.esc(e.ctx || '')}</textarea></div>
        <div class="row"><button class="btn btn-ink" type="submit">${S.custom[e.id] ? '수정 저장' : '문제 등록'}</button><button class="btn btn-line" type="button" id="ed-reset">새로 작성</button></div>
        <div id="ed-msg">${ui.msg}</div>
      </form>
      <div style="display:grid;gap:10px;min-width:0" class="side"><div class="eyebrow">미리보기 · 자동 검증</div><div id="ed-prev"></div></div></div>`;
  }
  function readEditor(el) {
    const e = ui.ed, v = id => U.$('#' + id, el).value;
    e.lv = +v('ed-lv'); e.tp = v('ed-tp'); e.ti = v('ed-ti').trim();
    const pl = +v('ed-pl'); if (pl !== +e.pl) { e.pl = pl; if (!PD.POS[pl].includes(e.h)) e.h = 'BB'; }
    e.bl = [+v('ed-sb'), +v('ed-bb'), +v('ed-an')];
    e.s = parseStack(v('ed-sd'), v('ed-sx'));
    e.h = U.$('#ed-h', el).value; e.c = v('ed-c').replace(/\s/g, ''); e.b = v('ed-b').replace(/\s/g, '');
    e.a = v('ed-a').trim(); e.o = v('ed-o').trim().split(/\s+/).filter(Boolean);
    e.w = v('ed-w').trim(); e.ctx = v('ed-ctx').trim();
    const notes = U.$$('[data-ednote]', el); if (notes.length) e.n = notes.map(x => x.value.trim());
    const ans = U.$$('[data-edans]', el).filter(x => x.checked).map(x => +x.dataset.edans);
    if (U.$$('[data-edans]', el).length) e.ans = ans.length === 1 ? ans[0] : ans;
  }
  function paintPreview(el) {
    const p = edProblem(), { st, errs } = PD.validate(p);
    const prev = U.$('#ed-prev', el);
    let next = '';
    if (!st) { const m = /현재 (\S+)\)/.exec(errs[0] || ''); if (m) next = `<div class="small muted">다음 차례는 <b>${U.esc(m[1])}</b>입니다. 그 사람의 액션을 이어서 적으세요.</div>`; }
    prev.innerHTML = (st ? `<div class="tablewrap">${TableView.render(st, { units: 'bb', label: p.ti })}</div>` : '') + next +
      (errs.length ? `<ul class="errs">${errs.map(x => `<li>${U.esc(x)}</li>`).join('')}</ul>` : `<div class="okmsg">검증 통과 · 팟 ${TableView.amt(st.total, st.bb, 'bb')} · 콜 금액 ${TableView.amt(st.toCall, st.bb, 'bb')}</div>`);
    // 선택지별 정답·설명 칸
    const box = U.$('#ed-opts', el), ans = [].concat(ui.ed.ans ?? []);
    const sig = p.o.join('|');
    if (box.dataset.sig !== sig) {
      box.dataset.sig = sig;
      box.innerHTML = p.o.map((tok, i) => {
        let lb = tok; try { if (st) lb = App.optLabel(st, tok); } catch (x) { }
        return `<div class="field"><label class="ansbox"><span style="display:flex;gap:8px;align-items:center"><input type="checkbox" data-edans="${i}" ${ans.includes(i) ? 'checked' : ''}> <b>${U.esc(lb)}</b> 정답</span></label><textarea data-ednote="${i}" aria-label="선택지 ${i + 1} 설명" placeholder="이 선택의 문제점">${U.esc((ui.ed.n || [])[i] || '')}</textarea></div>`;
      }).join('');
    }
  }
  function bindEditor(el) {
    const form = U.$('#ed', el);
    let t;
    form.oninput = form.onchange = ev => {
      if (ev.target.id === 'ed-pl') { readEditor(el); rerenderBody(); return; }
      clearTimeout(t); t = setTimeout(() => { if (!document.body.contains(form)) return; readEditor(el); paintPreview(el); }, 200);
    };
    U.$('#ed-reset', el).onclick = () => { ui.ed = blank(); ui.msg = ''; rerenderBody(); };
    form.onsubmit = ev => {
      ev.preventDefault(); readEditor(el);
      const p = edProblem(); const { errs } = PD.validate(p);
      if (errs.length) { U.$('#ed-msg', el).innerHTML = `<ul class="errs">${errs.map(x => `<li>${U.esc(x)}</li>`).join('')}</ul>`; return; }
      p.custom = true; Store.saveCustom(p);
      if (!S.review[p.id]) Store.setAdmin('review', { ...S.review, [p.id]: 'draft' });
      ui.ed = blank(); ui.msg = `<div class="okmsg">${p.id} 등록됨 · 검수 대기 상태로 저장했습니다.</div>`; rerenderBody();
    };
    paintPreview(el);
  }

          ? `<div class="odv ok"><b>콜이 이득이에요</b><span class="num">필요보다 ${diff.toFixed(1)}%p 높음 · 콜 한 번에 평균 +${fmtN(ev)}</span></div>`
          : `<div class="odv no"><b>폴드가 나아요</b><span class="num">필요보다 ${(-diff).toFixed(1)}%p 낮음 · 콜 한 번에 평균 −${fmtN(-ev)}</span></div>`;
    }
    el.innerHTML = `<div class="oddsout num"><div><span>콜에 필요한 승률</span><b>${pct1(need)}%</b></div><div><span>내 승률</span><b>${me == null ? '—' : pct1(me) + '%'}</b></div></div>${verdict}
      <p class="small muted" style="margin:0">필요 승률 = 콜 ÷ (팟 + 콜). 앞으로 더 오갈 베팅은 넣지 않은 값이에요.</p>`;
  }
  function paintCats(r, stale) {
    const el = $('sim-cats'), note = $('sim-catnote'); if (!el) return;
    el.classList.toggle('stale', !!stale);
    if (!r || r.err) { el.innerHTML = `<p class="small muted" style="margin:0">${r ? '내 카드를 고르면 보여 드려요.' : '계산 중…'}</p>`; if (note) note.textContent = ''; return; }
    if (note) note.textContent = boardN() === 5 ? '완성된 족보' : '남은 카드까지 다 받았을 때';
    el.innerHTML = r.cat.map((x, k) => ({ x, k })).reverse().filter(o => o.x > 0 || o.k <= 6).map(({ x, k }) =>
      `<div class="cat"><span>${E.CAT_KO[k]}</span><div class="cbar" aria-hidden="true"><i style="width:${(x * 100).toFixed(2)}%"></i></div><b class="num">${x > 0 && x < .001 ? '&lt;0.1%' : pct1(x) + '%'}</b></div>`).join('');
  }
  function paint(r) { paintRows(r); paintSum(r); paintHist(r); paintOdds(r); paintCats(r); }

  function record(r) {
    const b = st.board.filter(Boolean), s = STREET.find(x => x[2] === b.length);
    if (!s) return;
    const ps = psOf();
    if (st.hist.ps !== ps) st.hist = { ps };
    st.hist[s[0]] = { eq: r.players[0].eq, b: b.join('') };
    persist();
  }
  function schedule(delay = 140) {
    clearTimeout(timer);
    if (job) { job.cancel(); job = null; }
    const sig = sigOf();
    if (last && last.sig === sig) { paint(last.res); return; }
    const prev = last && !last.res.err ? last.res : null;
    paintRows(prev ? { ...prev, done: false } : null);
    paintSum(prev, !!prev); paintHist(null); paintOdds(null); paintCats(prev, true);
    timer = setTimeout(() => {
      job = E.run({ players: st.hands.slice(0, st.n).map((h, i) => ({ c: h.slice(), pct: i ? st.pct[i] : 100 })), board: st.board.filter(Boolean) }, {
        onProgress: r => { if (!alive()) { if (job) job.cancel(); job = null; return; } paint(r); },
        onDone: r => { job = null; last = { sig, res: r }; if (!r.err) record(r); if (alive()) paint(r); }
      });
    }, delay);
  }

  // ---------- 상대 패 열어 보기(리버에서 가려진 패를 레인지 안에서 한 번 뽑기) ----------
  let revealRes = null;
  const hiddenOpp = () => st.hands.slice(1, st.n).some(h => !h[0] || !h[1]);
  function drawReveal() {
    for (let attempt = 0; attempt < 60; attempt++) {
      const taken = used(), hands = [];
      let ok = true;
      for (let i = 0; i < st.n && ok; i++) {
        const h = st.hands[i];
        if (h[0] && h[1]) { hands.push({ c: h.slice(), hid: false }); continue; }
        let c;
        if (h[0] || h[1]) { const k = h[0] || h[1], free = []; for (const r of E.RANKS) for (const s of E.SUITS) if (!taken.has(r + s)) free.push(r + s); c = [k, pick1(free)]; }
        else {
          const cs = E.range(st.pct[i]).combos.filter(([a, b]) => !taken.has(E.toStr(a)) && !taken.has(E.toStr(b)));
          if (!cs.length) { ok = false; break; }
          c = pick1(cs).map(E.toStr);
        }
        c.forEach(x => taken.add(x));
        hands.push({ c, hid: true });
      }
      if (!ok) continue;
      const b = st.board.filter(Boolean);
      const vals = hands.map(o => E.evalCards(Int32Array.from(o.c.concat(b).map(E.toInt)), 7));
      const best = Math.max(...vals), nb = vals.filter(x => x === best).length;
      return { sig: sigOf(), hands: hands.map((o, i) => ({ ...o, v: vals[i], win: vals[i] === best, split: nb > 1, L: PD.handLabel(o.c.concat(b)) })) };
    }
    return { sig: sigOf(), err: '레인지가 겹쳐서 상대 패를 뽑지 못했어요.' };
  }
  function revealHtml() {
    const r = revealRes;
    if (!r || r.sig !== sigOf()) return '';
    if (r.err) return `<p class="small" style="margin:0;color:var(--amber)">${U.esc(r.err)}</p>`;
    const me = r.hands[0], same = o => o.L.name === me.L.name && o.L.key === me.L.key;
    const kick = me.win ? !me.split && r.hands.some(o => !o.win && same(o)) : r.hands.some(o => o.win && same(o));
    const line = (me.win ? (me.split ? '이번엔 팟을 나눠 가졌어요' : '이번엔 내가 이겼어요') : '이번엔 내가 졌어요') + (kick ? ' · 키커 차이' : '');
    return `<div class="reveal"><div class="spread"><b class="rvt ${me.win ? 'ok' : 'no'}">${line}</b><span class="small muted">무작위로 한 번 뽑은 예</span></div>
      ${r.hands.map((o, i) => `<div class="rvrow${o.win ? ' win' : ''}" style="--pc:${COL[i]}"><span class="nm">${who(i)}</span>${TableView.miniCards(o.c)}<span class="hn">${HAND_KO[o.L.name] || o.L.name} ${U.esc(o.L.key)}</span><span class="wl">${o.win ? (o.split ? '무' : '승') : ''}</span></div>`).join('')}
      <p class="small muted" style="margin:0">승률은 이런 판을 수없이 반복했을 때 내가 가져가는 몫이에요. 다시 열면 다른 경우가 나와요.</p></div>`;
  }

  // ---------- 카드 고르기 ----------
  function nextSlot(id) {
    if (id[0] === 'p') { const o = `p${id[1]}c${1 - +id[3]}`; return getSlot(o) ? null : o; }
    const k = +id.slice(1);
    if (k <= 2) for (const kk of [0, 1, 2]) if (!st.board[kk]) return 'b' + kk;
    return null;
  }
  function openPicker(id) {
    if (id[0] === 'b') {
      const k = +id.slice(1);
      if (k === 3 && boardN() < 3) { U.toast('플랍 3장을 먼저 골라 주세요'); return; }
      if (k === 4 && !st.board[3]) { U.toast('턴 카드를 먼저 골라 주세요'); return; }
    }
    const u = used(id), cur = getSlot(id);
    const grp = id[0] === 'p' ? [`p${id[1]}c0`, `p${id[1]}c1`] : +id.slice(1) <= 2 ? ['b0', 'b1', 'b2'] : [id];
    const prev = grp.map(g => {
      const c = getSlot(g), on = g === id ? ' on' : '';
      if (!c) return `<span class="pv empty${on}">${g === id ? '?' : ''}</span>`;
      const [gl, col] = TableView.SUIT[c[1]];
      return `<span class="pv${on}" style="color:${col}">${TableView.RK(c[0])}${gl}&#xFE0E;</span>`;
    }).join('');
    const cells = E.SUITS.split('').map(s => 'AKQJT98765432'.split('').map(r => {
      const c = r + s, [gl, col] = TableView.SUIT[s];
      return `<button type="button" class="pk" data-c="${c}" style="color:${col}" ${u.has(c) ? 'disabled' : ''} aria-pressed="${cur === c}" aria-label="${SUIT_KO[s]} ${TableView.RK(r)}"><span>${TableView.RK(r)}</span><span>${gl}&#xFE0E;</span></button>`;
    }).join('')).join('');
    const v = Layer.open(`<div class="picker">
      <div class="pk-head"><div><b>${U.esc(slotName(id))}</b><div class="pvs">${prev}</div></div><button class="adx" type="button" id="pk-x">닫기</button></div>
      <div class="pk-grid">${cells}</div>
      <div class="pk-foot"><button class="btn btn-line" type="button" id="pk-rand">무작위 카드</button><button class="btn btn-line" type="button" id="pk-clear" ${cur ? '' : 'disabled'}>이 칸 비우기</button></div>
    </div>`, '카드 고르기');
    v.classList.add('sheetveil');
    v.onclick = e => { if (e.target === v) Layer.close(); };
    U.$('#pk-x', v).onclick = Layer.close;
    const choose = c => {
      setSlot(id, c); persist(); App.render();
      const nx = c && nextSlot(id);
      if (nx) openPicker(nx); else Layer.close();
    };
    U.$$('.pk', v).forEach(b => b.onclick = () => choose(b.dataset.c));
    U.$('#pk-rand', v).onclick = () => choose(pick1(freeCards(id)));
    U.$('#pk-clear', v).onclick = () => choose(null);
    const first = U.$('.pk[aria-pressed="true"]', v) || U.$('.pk:not([disabled])', v);
    if (first) first.focus({ preventScroll: true });
  }

  // ---------- 동작 ----------
  function applyPreset(p) {
    st.n = p.p.length;
    st.hands = Array.from({ length: MAXN }, (_, i) => (p.p[i] ? p.p[i].slice() : [null, null]));
    st.pct = Array.from({ length: MAXN }, (_, i) => (p.pct && p.pct[i]) || 100);
    st.board = [0, 1, 2, 3, 4].map(k => p.b[k] || null);
    persist(); App.render();
  }
  function bind(el) {
    U.$$('[data-preset]', el).forEach(b => b.onclick = () => applyPreset(PRESETS[+b.dataset.preset]));
    U.$$('[data-n]', el).forEach(b => b.onclick = () => {
      const k = +b.dataset.n;
      for (let i = k; i < MAXN; i++) { st.hands[i] = [null, null]; st.pct[i] = 100; }
      st.n = k; persist(); App.render();
    });
    U.$$('[data-slot]', el).forEach(b => b.onclick = () => openPicker(b.dataset.slot));
    U.$$('[data-pct]', el).forEach(s => s.onchange = () => { st.pct[+s.dataset.pct] = +s.value; persist(); App.render(); });
    U.$('#sim-rme', el).onclick = () => {
      st.hands[0] = [null, null];
      const a = pick1(freeCards()); st.hands[0][0] = a;
      st.hands[0][1] = pick1(freeCards());
      persist(); App.render();
    };
    U.$('#sim-reset', el).onclick = () => { const keep = st.n; st = blank(); st.n = keep; last = null; persist(); App.render(); };
    U.$('#sim-next', el).onclick = () => {
      const n = boardN(), upto = n < 3 ? 3 : n + 1;
      for (let k = 0; k < upto; k++) if (!st.board[k]) st.board[k] = pick1(freeCards());
      persist(); App.render();
    };
    U.$('#sim-bclear', el).onclick = () => { st.board = [null, null, null, null, null]; persist(); App.render(); };
    const rv = U.$('#sim-reveal', el);
    if (rv) rv.onclick = () => { revealRes = drawReveal(); U.$('#sim-rv', el).innerHTML = revealHtml(); rv.textContent = '한 번 더 열어 보기'; };
    const onOdds = () => { st.pot = U.$('#sim-pot', el).value.slice(0, 9); st.call = U.$('#sim-call', el).value.slice(0, 9); persist(); paintOdds(last && last.sig === sigOf() ? last.res : null); };
    U.$('#sim-pot', el).oninput = onOdds; U.$('#sim-call', el).oninput = onOdds;
    schedule();
  }

  return { html, bind, state: () => st, PRESETS };
})();

// 공개 설정입니다. API 키를 넣지 마세요. 배포한 서버의 /api/coach 주소만 설정합니다.
const COACH_CONFIG = Object.freeze({ endpoint: '' });

/* GTO 원칙 학습 코치. 대화는 현재 탭 메모리에만 보관합니다. */
const Coach = (() => {
  const samples = [
    ['3벳 대응', '6인 캐시게임, 유효 스택 100BB입니다. BTN에서 AsQs로 2.5BB 오픈, SB가 11BB로 3벳하고 BB는 폴드했습니다. 콜·4벳을 어떻게 판단하나요? 레이크는 모릅니다.'],

  ];
  let messages = [], busy = false, controller = null, returnFocus = null;
  const balance = () => Math.max(0, Math.floor(Number(Store.S.p.aiTickets) || 0));
  function endpoint() {
    try { const u = new URL(COACH_CONFIG.endpoint); return u.protocol === 'https:' ? u.href : ''; }
    catch { return ''; }
  }
  function open(question = '') {
    returnFocus = document.activeElement;
    let d = document.getElementById('coach-dialog');
    if (!d) {
      d = document.createElement('dialog'); d.id = 'coach-dialog'; d.className = 'coach-dialog';
      d.setAttribute('aria-labelledby', 'coach-title');
      d.innerHTML = `<div class="coach-head"><div><span class="eyebrow">HOLDEM GOSU · STUDY</span><h2 id="coach-title">GTO AI 코치</h2></div><button type="button" class="ibtn" id="coach-close" aria-label="채팅 닫기">×</button></div>
        <div class="coach-about">콜할까, 레이즈할까?<br><b>판단의 이유까지 함께 배워보세요.</b><p>GTO 원칙에 따른 AI 해설입니다. 솔버 계산 결과가 아니며, 정확한 액션 빈도·EV를 보장하지 않습니다.</p></div>
        <div id="coach-status" class="coach-status" role="status"></div>
        <div class="coach-wallet"><div><b id="coach-balance"></b><span>최초 1개 무료 · 답변 1회당 1개</span></div><div><button type="button" id="coach-ad">광고 보고 +1</button><button type="button" id="coach-invite">친구 초대 +1</button></div></div>
        <div class="coach-samples">${samples.map(([label], i) => `<button type="button" data-coach-sample="${i}">${label} ↗</button>`).join('')}</div>
        <div id="coach-messages" class="coach-messages" role="log" aria-label="코치와의 대화" aria-live="polite"></div>
        <form id="coach-form"><label for="coach-input">포커 상황 또는 궁금한 점</label><textarea id="coach-input" rows="3" maxlength="3000" placeholder="내 패 / 포지션 / 유효 스택 / 보드 / 지금까지의 액션을 적어주세요."></textarea><div id="coach-error" class="coach-error" role="alert"></div><div class="coach-actions"><button type="button" id="coach-clear" class="link">새 대화</button><button type="button" id="coach-stop" class="btn btn-line" hidden>중단</button><button type="submit" id="coach-send" class="btn btn-ink">코치에게 질문 ↗</button></div><p class="coach-privacy">전송한 질문과 최근 대화가 AI 서비스에 전달됩니다. 이름·연락처 등 개인정보는 입력하지 마세요. 대화는 새로고침하면 사라집니다.</p></form>`;
      document.body.append(d);

      d.addEventListener('close', () => { if (returnFocus?.isConnected) returnFocus.focus(); });

      d.querySelector('#coach-invite').onclick = () => { if (busy) return; d.close(); App.go('invite'); };
      Store.on(what => { if (what === 'progress') paint(); });
      d.querySelector('#coach-input').onkeydown = e => { if ((e.ctrlKey || e.metaKey) && e.key === 'Enter' && !e.isComposing) { e.preventDefault(); d.querySelector('#coach-form').requestSubmit(); } };

  }
  const input = () => document.getElementById('coach-input');

  function paint() {

    log.scrollTop = log.scrollHeight;
    document.getElementById('coach-status').textContent = endpoint() ? '학습·복기용 · Ctrl/⌘ + Enter로 전송' : 'AI 연결 준비 중입니다. 운영자가 연결을 완료하면 질문을 보낼 수 있어요.';
    document.getElementById('coach-balance').textContent = `AI 질문권 ${balance()}개`;
    document.getElementById('coach-ad').disabled = busy;
    document.getElementById('coach-invite').disabled = busy;

    if (endpoint() && !balance()) document.getElementById('coach-status').textContent = '질문권을 모두 사용했어요. 광고 완료 또는 친구 참여 보상으로 1개를 받을 수 있습니다.';
    document.getElementById('coach-clear').disabled = busy;
    document.getElementById('coach-stop').hidden = !busy;
    input().disabled = busy;
  }
  async function send(e) {
    e.preventDefault(); if (busy || !endpoint()) return;
    if (balance() < 1) { error('AI 질문권이 필요합니다. 광고 완료 또는 친구 초대 보상을 이용해 주세요.'); return; }
    const question = input().value.trim(); if (!question) { error('질문을 입력해 주세요.'); return; }
    error(''); messages.push({ role: 'user', content: question }); busy = true; input().value = ''; paint();
    controller = new AbortController(); const timer = setTimeout(() => controller?.abort(), 55000);
    try {
      const response = await fetch(endpoint(), { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ messages: messages.slice(-11) }), signal: controller.signal, credentials: 'omit' });
      const data = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(({429:'잠시 질문이 몰렸어요. 1분 후 다시 시도해 주세요.',503:'AI 연결 준비 중입니다. 잠시 후 다시 이용해 주세요.'})[response.status] || '답변을 받지 못했습니다. 잠시 후 다시 시도해 주세요.');
      if (typeof data.answer !== 'string' || !data.answer.trim()) throw new Error('답변이 비어 있습니다. 다시 시도해 주세요.');
      Store.S.p.aiTickets = Math.max(0, balance() - 1); Store.save(true);
      messages.push({ role: 'assistant', content: data.answer }); messages = messages.slice(-20);
    } catch (err) {
      messages.pop(); input().value = question;
      error(err.name === 'AbortError' ? '요청이 중단되었거나 응답 시간이 초과되었습니다. 질문은 그대로 남겨 두었습니다.' : err.message === 'Failed to fetch' ? '연결할 수 없습니다. 인터넷 연결을 확인하고 다시 시도해 주세요.' : err.message);
    } finally { clearTimeout(timer); controller = null; busy = false; paint(); if (document.getElementById('coach-dialog').open) input().focus(); }
  }
  function askProblem(p) {
    const st = PD.build(p), bb = x => +(x / st.bb).toFixed(2);
    const snapshot = { format: p.format === 'cash' ? '노리밋 홀덤 링게임' : '노리밋 홀덤 토너먼트', players: st.n, heroPosition: p.h, heroCards: st.heroCards, board: st.board, effectiveStackBB: st.effBB, potIncludingBetsBB: bb(st.total), toCallBB: bb(Math.min(st.toCall, st.hero.stack)), blinds: p.bl, initialStacksBB: p.s, actionTokens: p.a, situation: p.ctx || '', options: p.o };
    open('이 학습 문제를 GTO 원칙으로 복기해 주세요. 권장 행동과 다른 선택을 비교하고, 정보가 부족한 부분은 알려주세요.\n' + JSON.stringify(snapshot) + '\n액션 표기: f 폴드, x 체크, c 콜, b 숫자BB 베팅, r 숫자BB까지 레이즈, a 올인. |는 스트리트 구분입니다. 액션은 각 스트리트의 행동 순서대로입니다.');
  }
  return { open, askProblem };
})();

function rankRows(kind) {
  const wk = Store.weekKey(), ex = new Set(Sx.flags.excluded || []);
  const rows = Object.entries(Sx.players).map(([id, r]) => ({ id, ...r }));
  const meId = Sx.uid || 'me';
  if (Sx.p.nick) {
    const mine = { id: meId, ...Store.publicRow(Sx.p) };
    const i = rows.findIndex(r => r.id === meId);
    if (i >= 0) rows[i] = mine; else rows.push(mine);
  }
  return rows.filter(r => !ex.has(r.id)).map(r => {
    const week = kind === 'week';
    const c = week ? (r.wk === wk ? r.wc : 0) : r.tc, a = week ? (r.wk === wk ? r.wa : 0) : r.ta, p = week ? (r.wk === wk ? r.wp : 0) : r.tp;
    return { id: r.id, nick: r.nick || '이름 없음', c: c || 0, a: a || 0, p: p || 0, acc: a ? c / a : 0, me: r.id === meId };
  }).filter(r => r.a > 0).sort((x, y) => y.c - x.c || y.acc - x.acc || x.a - y.a);
}

  html() {
    const kind = App.ui.rankTab, rows = rankRows(kind);

function processInvites() {
  const p = Sx.p, s = Sx.settings; Store.roll(p);
  let n = 0;
  for (const inv of [...Sx.invites].sort((a, b) => (a.at || 0) - (b.at || 0))) {
    if (inv.id === Sx.uid || p.credited.includes(inv.id)) continue;
    if (p.invDay.n >= s.inviteDailyLimit) break;
    p.credited.push(inv.id); p.invDay.n++; p.tix.inv += s.inviteReward; p.ctr.invDone++; p.aiTickets = (p.aiTickets ?? 1) + 1; n++;
  }
  if (n) { Store.save(); U.toast(`친구 ${n}명이 참여했어요 · 이용권 +${n * s.inviteReward} · AI 질문권 +${n}`); App.render(); }
}

      <div class="field"><label for="nick">닉네임</label><input id="nick" maxlength="12" autocomplete="nickname" value="${U.esc(p.nick)}" placeholder="2~12자"><span class="hint">랭킹에 표시됩니다. 한글·영문·숫자·밑줄만 쓸 수 있어요.</span></div>
      <p class="small muted" style="margin:0">${where}</p><p class="small" id="lerr" style="margin:0;color:var(--bad)" hidden></p>
      <div class="row" style="justify-content:flex-end"><button class="btn btn-line" type="button" id="lc">취소</button><button class="btn btn-ink" type="submit">저장</button></div></form>`, '간편 로그인');
    const inp = U.$('#nick', v); inp.focus();
    U.$('#lc', v).onclick = Layer.close;
    v.onclick = e => { if (e.target === v) Layer.close(); };
    U.$('#lf', v).onsubmit = e => {
      e.preventDefault();
      const n = inp.value.trim();
      if (!/^[\p{L}\p{N}_]{2,12}$/u.test(n)) { const er = U.$('#lerr', v); er.hidden = false; er.textContent = '닉네임은 2~12자의 한글·영문·숫자·밑줄로 입력하세요.'; return; }
      Sx.p.nick = n; Store.save(true); Layer.close(); U.toast(`${n}님, 기록 저장을 시작합니다`); App.render();
    };
  }
};

// ================= 모의 광고 =================
const Ad = {
  open() {
    const s = Sx.settings; Store.roll(Sx.p);
    if (s.adDailyLimit && Sx.p.adDay.n >= s.adDailyLimit) { U.toast('오늘 광고 보상 한도에 도달했습니다'); return; }
    Sx.p.ctr.adStart++; Store.save();
    const v = Layer.open(`<div class="adbox"><div class="adtop"><span class="adtag">모의 광고 · 실제 광고 아님 · 수익 없음</span><button class="adx" type="button" id="adx" disabled>닫기</button></div>
      <div class="adstage"><canvas id="adc" aria-hidden="true"></canvas><div class="admsg" id="admsg"><b class="num" id="adsec">${s.adSeconds}</b><span>보상형 광고 자리입니다. 실서비스에서는 광고사의 동영상이 재생되고, 시청 완료가 확인되면 이용권이 지급됩니다.</span></div></div>
      <div class="adbar"><i id="adbar"></i></div>
      <div class="adfoot" id="adfoot"><button class="btn btn-brass btn-block" type="button" id="claim" disabled>끝까지 보면 이용권 ${s.adReward}개 + AI 질문권 1개</button></div></div>`, '모의 광고');
    const t0 = Date.now(), dur = s.adSeconds * 1000;
    let finished = false, raf = 0, iv = 0;
    const cv = U.$('#adc', v), ctx = cv.getContext('2d');
    const glyphs = ['♠', '♥', '♦', '♣'], cols = ['#e9efe9', '#ff7a6b', '#7fb0ff', '#6fd39a'];
    const parts = Array.from({ length: 22 }, () => ({ x: Math.random(), y: Math.random(), v: .0006 + Math.random() * .0014, g: Math.floor(Math.random() * 4), s: 10 + Math.random() * 18 }));
    const still = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
    const draw = () => {
      const w = cv.clientWidth, h = cv.clientHeight; if (cv.width !== w) { cv.width = w; cv.height = h; }
      ctx.clearRect(0, 0, w, h);
      parts.forEach(p => { if (!still) p.y += p.v; if (p.y > 1.05) p.y = -.05; ctx.globalAlpha = .28; ctx.fillStyle = cols[p.g]; ctx.font = `${p.s}px sans-serif`; ctx.fillText(glyphs[p.g], p.x * w, p.y * h); });
      raf = requestAnimationFrame(draw);
    };
    draw();
    const stop = () => { cancelAnimationFrame(raf); clearInterval(iv); };
    const fail = (title, body) => {
      stop();
      U.$('#admsg', v).innerHTML = `<b style="font-size:22px">${title}</b><span>${body}</span>`;
      U.$('#adfoot', v).innerHTML = `<button class="btn btn-brass btn-block" type="button" id="retry">다시 시도</button><button class="btn btn-line btn-block" type="button" id="toinv">친구 초대로 받기</button><button class="btn btn-line btn-block" type="button" id="cl">닫기</button>`;
      U.$('#adx', v).disabled = false;
      U.$('#retry', v).onclick = () => { Layer.close(); Ad.open(); };
      U.$('#toinv', v).onclick = () => { Layer.close(); App.go('invite'); };
      U.$('#cl', v).onclick = U.$('#adx', v).onclick = () => { Layer.close(); App.render(); };
    };
    if (s.adFailSim) { setTimeout(() => { Sx.p.ctr.adFail++; Store.save(); fail('광고를 불러오지 못했습니다', '보상은 지급되지 않았습니다. 잠시 후 다시 시도하거나 친구 초대로 이용권을 받을 수 있어요.'); }, 1200); return; }
    iv = setInterval(() => {
      const el = Date.now() - t0, left = Math.max(0, Math.ceil((dur - el) / 1000));
      U.$('#adbar', v).style.width = Math.min(100, el / dur * 100) + '%';
      U.$('#adsec', v).textContent = left;
      const x = U.$('#adx', v);
      if (el >= s.adSkipAfter * 1000 && x.disabled && !finished) { x.disabled = false; }
      if (el >= dur && !finished) {
        finished = true; clearInterval(iv);
        U.$('#adsec', v).textContent = '완료';
        const c = U.$('#claim', v); c.disabled = false; c.textContent = `이용권 ${s.adReward}개 + AI 질문권 1개 받기`;
      }
    }, 200);
    U.$('#adx', v).onclick = () => {
      if (finished) { stop(); Layer.close(); return; }
      fail('광고를 끝까지 보지 않았습니다', '시청을 완료해야 보상이 지급됩니다. 다시 시도하거나 친구 초대로 받을 수 있어요.');
    };
    U.$('#claim', v).onclick = () => {
      if (!finished) return;
      finished = false;
      stop(); Store.roll(Sx.p);
      Sx.p.tix.ad += s.adReward; Sx.p.adDay.n++; Sx.p.ctr.adDone++; Sx.p.aiTickets = (Sx.p.aiTickets ?? 1) + 1; Store.save(true);
      Layer.close(); U.toast(`이용권 +${s.adReward} · AI 질문권 +1`); App.render();
    };
  }
};

// ================= 시작 =================
function boot(data) {
  Store.initLocal();
  const m = /^#inv-([A-Za-z0-9]{4,10})$/.exec(location.hash || '');
  if (m && !Sx.p.tot.a && !Sx.p.invitedBy) { Sx.p.pendingInv = m[1].toUpperCase(); Store.save(); }
  if (data && data.ui) { try { Object.assign(App.ui, data.ui); if (App.ui.view === 'play' && !App.ui.set) App.ui.view = 'home'; } catch (e) { } }
  U.$('#coach-top').onclick = () => Coach.open();
  U.$('#go-home').onclick = () => App.go('home');
  U.$('#who-btn').onclick = () => Sx.p.nick ? App.go('notes') : Login.open();
  U.$('#ev-btn').onclick = U.$('#tix-chip').onclick = () => { if (App.ui.view === 'play') { U.toast(`남은 이용권 ${App.tickets()}개`); return; } App.ui.set = { ids: [], idx: 0, answers: [], mode: 'scored', empty: true }; App.go('result'); };
  U.$$('.nav [data-nav]').forEach(b => b.onclick = () => App.go(b.dataset.nav));
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && U.$('#layer').innerHTML && !U.$('#adc')) Layer.close(); });
  App.render();
  Store.on(what => {
    const v = App.ui.view;
    if (what === 'invites') { processInvites(); if (v === 'invite') App.render(); return; }
    if (what === 'progress' || what === 'readonly') { App.paintHeader(); if (v === 'home' || v === 'notes') App.render(); return; }
    if (what === 'players') { if (v === 'rank') App.render(); else if (v === 'admin') Admin.refreshLive(); return; }
    if (['settings', 'review', 'edits', 'custom', 'flags', 'who'].includes(what)) { if (v === 'admin') Admin.refreshLive(what); else if (v !== 'play') App.render(); else App.paintHeader(); }
  });
  Store.initRemote();
}
try { window.claude?.hot?.snapshot?.(() => ({ ui: JSON.parse(JSON.stringify(App.ui)) })); } catch (e) { }
if (window.claude?.hot?.ready) window.claude.hot.ready(boot); else boot(window.claude?.hot?.data ?? {});

</script>
</body>
</html>
